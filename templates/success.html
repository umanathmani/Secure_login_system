<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureAuth | Account Created</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="background"></div>

    <div class="login-container">

        <!-- Brand -->
        <div class="brand">

            <div class="brand-icon">◈</div>

            <h1>
                SECURE<span>AUTH</span>
            </h1>

            <p>SYSTEM ONLINE</p>

        </div>


        <!-- Success Card -->
        <div class="login-card success-card">

            <div class="success-icon">
                ✓
            </div>

            <h2>Account Created</h2>

            <p class="subtitle">
                Your SecureAuth account has been created successfully.
            </p>


            <div class="security-message">

                <div class="status-dot"></div>

                <div>
                    <strong>ACCOUNT SECURED</strong>
                    <p>
                        Your password has been securely encrypted
                        before being stored.
                    </p>
                </div>

            </div>


            <a href="/" class="login-button">
                GO TO LOGIN
            </a>


            <div class="divider">
                <span>SECURITY</span>
            </div>


            <p class="protected">
                🔒 Adaptive Authentication Protection Enabled
            </p>

        </div>

    </div>

</body>
</html>
