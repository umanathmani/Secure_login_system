<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Recovery - Secure Login System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #14213d,
                    #080d18 55%,
                    #05070c
                );

            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;

            background: rgba(13, 20, 34, 0.95);

            border: 1px solid #202c42;

            border-radius: 16px;

            padding: 35px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #8793a8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #aeb8c9;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            background: #0a111e;

            border: 1px solid #2a3850;

            border-radius: 8px;

            color: white;

            font-size: 14px;

            outline: none;

            margin-bottom: 18px;
        }

        input:focus {
            border-color: #00e0ad;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #00e0ad;

            color: #06100e;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            background: rgba(255, 77, 109, 0.1);

            border: 1px solid rgba(255, 77, 109, 0.3);

            color: #ff4d6d;

            padding: 12px;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 18px;

            text-align: center;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #8793a8;

            text-decoration: none;

            font-size: 13px;
        }

        .back:hover {
            color: #00e0ad;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="icon">
        🔐
    </div>

    <h1>
        Account Recovery
    </h1>

    <div class="subtitle">
        Enter your registered username to recover your locked account.
    </div>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >

        <button type="submit">
            Send Recovery OTP
        </button>

    </form>

    <a
        href="{{ url_for('login') }}"
        class="back"
    >
        ← Back to Login
    </a>

</div>

</body>
</html>
